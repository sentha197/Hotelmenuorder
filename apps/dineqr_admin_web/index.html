<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#140a0c" />
    <meta name="description" content="DineQR Admin: orders, kitchen, bills, payments, menu and reports for your restaurant team." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/Icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>DineQR Admin</title>
    <script>
      // The theme before the first paint (src/theme/theme.ts takes over once
      // the app loads): the saved choice, else the device's appearance.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('dineqr.admin.theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
        var bar = document.querySelector('meta[name="theme-color"]');
        if (bar) bar.setAttribute('content', theme === 'light' ? '#f6f2f1' : '#140a0c');
      })();
    </script>
  </head>
  <body>
    <noscript>DineQR Admin needs JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
