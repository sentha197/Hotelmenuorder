name: dineqr_admin
description: "DineQR Admin - restaurant staff and management app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  dineqr_core:
    path: ../../packages/dineqr_core
  dineqr_design_system:
    path: ../../packages/dineqr_design_system

  # State management.
  provider: ^6.1.5+1
  flutter_secure_storage: ^11.2.0
  # Dish photos from the gallery or the camera.
  image_picker: ^1.2.4
  # Picking the restaurant's location for the GPS ordering area (needs a
  # Google Maps API key: --dart-define=GOOGLE_MAPS_API_KEY=...).
  google_maps_flutter: ^2.19.0
  # "Open in Google Maps" to check a location without a key.
  url_launcher: ^6.3.3
  # Loads the Maps JavaScript API on the web build.
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
