# Memory: builds crashed with native out-of-memory errors on a 16 GB Windows
# machine (system commit limit reached) while the template's 8 GB heap, a
# second Kotlin JVM and idle daemons all held memory. So:
# - 4 GB is enough for debug and release (R8) builds of this app;
# - the Kotlin compiler runs inside the Gradle daemon instead of in a second
#   JVM that inherits the heap setting;
# - idle daemons exit after 15 minutes instead of 3 hours.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon.idletimeout=900000
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The project (D:) and pub cache (C:) are on different drives; Kotlin
# incremental caches cannot relate the two paths on Windows.
kotlin.incremental=false
