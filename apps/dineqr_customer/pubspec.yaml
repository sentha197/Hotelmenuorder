name: dineqr_customer
description: "DineQR - scan the table QR, order, track, pay and rate."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  dineqr_core:
    path: ../../packages/dineqr_core
  dineqr_design_system:
    path: ../../packages/dineqr_design_system

  # State management.
  provider: ^6.1.5+1
  # Camera QR scanning and gallery image analysis.
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
