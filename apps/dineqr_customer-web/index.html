<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#B5121B" />
    <meta name="description" content="DineQR: scan the QR code on your table to browse the menu, order and pay." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DineQR" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/Icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>DineQR</title>
    <script>
      // The theme before the first paint (src/theme.ts takes over once the
      // app loads): the guest's saved choice, else the device's appearance.
      // The brand page (/about) is always dark.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('dineqr.theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        var about = /\/about\/?$/.test(location.pathname);
        if (about) theme = 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        var bar = document.querySelector('meta[name="theme-color"]');
        if (bar && !about) bar.setAttribute('content', theme === 'light' ? '#fbf7f5' : '#0b0708');
      })();
    </script>
  </head>
  <body>
    <noscript>DineQR needs JavaScript to show the menu and take your order.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
