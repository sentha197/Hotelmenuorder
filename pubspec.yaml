name: menu_order
description: "DineQR - QR-based restaurant ordering demo app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management.
  provider: ^6.1.5+1
  # Camera QR scanning and gallery image analysis.
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.4
  # Local persistence for table session, cart, favorites and orders.
  shared_preferences: ^2.5.6
  # Currency (en_IN) and date formatting.
  intl: ^0.20.3
  qr: ^3.0.2
  pdf: ^3.13.1
  printing: ^5.15.1
  crypto: ^3.0.7
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Poppins is bundled (SIL Open Font License, see assets/fonts/OFL.txt) so the
  # app looks the same offline.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
